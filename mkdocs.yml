site_name: Lab Instrument Guides
site_description: >-
  Simple user guides, animated demonstrations and an instrument booking system
  for the solid-state battery laboratory.
site_url: https://zacharyslate.github.io/lab-guides/
repo_url: https://github.com/zacharyslate/lab-guides
repo_name: zacharyslate/lab-guides
copyright: "Instrument guides of the Sol-Gel group, Departamento de Vidrios, Instituto de Cerámica y Vidrio (ICV-CSIC), Madrid. Not an official CSIC website."
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/flask-outline
  favicon: assets/img/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
