<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of an Argolab drying oven with its microprocessor controller: display, SET/PROG, up, down, SHIFT and START/STOP keys">
<text class="ttl" x="20" y="28" data-i18n="ov.title">Argolab drying oven — programs and PROG 0</text>
<rect class="body" x="60" y="70" width="360" height="350" rx="10"/>
<g class="part" id="ware"><rect class="gl" x="110" y="160" width="36" height="40" rx="4"/><rect class="gl" x="170" y="150" width="50" height="50" rx="20"/><rect class="gl" x="240" y="168" width="30" height="32" rx="3"/></g>
<g class="part" id="door" data-origin="60 245"><rect x="70" y="80" width="250" height="330" rx="6" style="fill:var(--demo-steel);stroke:var(--demo-steel-dk);stroke-width:1.5;opacity:.92"/><rect x="290" y="210" width="10" height="70" rx="3" class="dark"/></g>
<rect class="dark" x="78" y="88" width="234" height="314" rx="4" style="opacity:.18"/>
<line x1="80" y1="200" x2="310" y2="200" class="st" style="stroke-width:4"/><line x1="80" y1="300" x2="310" y2="300" class="st" style="stroke-width:4"/>
<g class="part" id="heatw"><path d="M120 395 q6 -10 0 -20 q-6 -10 0 -20" class="hot"/><path d="M190 395 q6 -10 0 -20 q-6 -10 0 -20" class="hot"/><path d="M260 395 q6 -10 0 -20 q-6 -10 0 -20" class="hot"/></g>
<g class="part" id="nogo"><circle cx="560" cy="380" r="34" style="fill:none;stroke:var(--demo-hot);stroke-width:5"/><line x1="536" y1="404" x2="584" y2="356" style="stroke:var(--demo-hot);stroke-width:5"/><text class="lbl-s" x="560" y="384" text-anchor="middle" style="font-size:10px" data-i18n="ov.solv">solvents</text><text class="lbl-s" x="606" y="370" data-i18n="ov.nogo1">no flammable solvents,</text><text class="lbl-s" x="606" y="384" data-i18n="ov.nogo2">no explosive or toxic-releasing</text><text class="lbl-s" x="606" y="398" data-i18n="ov.nogo3">materials</text></g>
<rect class="dark" x="330" y="90" width="80" height="300" rx="6"/>
<rect class="dark" x="470" y="80" width="300" height="230" rx="8"/>
<rect class="scr" x="490" y="100" width="260" height="110" rx="4"/>
<text x="740" y="160" text-anchor="end" style="fill:#ff5252;font-size:40px;font-family:monospace" id="ot">––</text>
<text x="500" y="122" style="fill:#ffe082;font-size:13px;font-family:monospace" id="op"></text>
<text x="500" y="198" style="fill:#4cff8a;font-size:13px;font-family:monospace" id="otm"></text>
<text x="740" y="198" text-anchor="end" style="fill:#9fb;font-size:12px;font-family:monospace" id="ofan"></text>
<g style="font-size:10px;fill:#fff" text-anchor="middle">
<rect x="490" y="232" width="62" height="28" rx="4" style="fill:#455a64"/><text x="521" y="250">SET/PROG</text>
<rect x="560" y="232" width="40" height="28" rx="4" style="fill:#455a64"/><text x="580" y="251" style="font-size:13px">▲</text>
<rect x="608" y="232" width="40" height="28" rx="4" style="fill:#455a64"/><text x="628" y="251" style="font-size:13px">▼</text>
<rect x="656" y="232" width="44" height="28" rx="4" style="fill:#455a64"/><text x="678" y="250">SHIFT</text>
<rect x="490" y="268" width="96" height="28" rx="4" style="fill:#2e7d32"/><text x="538" y="286">START/STOP</text>
<rect x="708" y="232" width="44" height="28" rx="4" style="fill:#455a64"/><text x="730" y="250">ON/OFF</text>
</g>
<g class="part" id="beep"><text x="740" y="122" text-anchor="end" style="fill:#ffab40;font-size:13px;font-family:monospace">end 🔔</text></g>
</svg>
