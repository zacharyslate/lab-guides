<text x="314" y="260">Active mass (mg)</text><text x="460" y="260">3.80</text>
<text x="314" y="282">Step file</text><text x="460" y="282">NMC_LiIn_0.1C.xml</text></g>
<rect x="600" y="306" width="66" height="24" rx="3" style="fill:#1b5e20"/><text x="633" y="322" text-anchor="middle" style="fill:#fff;font-size:11px">Start</text></g>
<g class="part" id="da"><rect x="215" y="160" width="555" height="260" rx="5" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="228" y="180" class="lbl" style="font-weight:700">BTSDA · data view</text>
<path class="axis" d="M250 390 H750 M250 390 V200"/>
<path d="M252 380 L300 250 L305 248 L355 380 L360 380 L408 252 L413 250 L463 380 L468 380 L516 254 L521 252 L571 380" style="fill:none;stroke:var(--demo-hl);stroke-width:2"/>
<text x="700" y="408" class="lbl-s">t</text><text x="232" y="210" class="lbl-s">V</text>
<text x="560" y="230" class="lbl-s">Export › Excel</text></g>
</svg>
