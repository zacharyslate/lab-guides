<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the Neware BTS client: device list, channel tiles, right-click Single start, step editor and data view">
<rect x="20" y="20" width="760" height="410" rx="6" style="fill:var(--md-default-bg-color,#fff);stroke:var(--demo-body-st)"/>
<rect x="20" y="20" width="760" height="26" rx="6" style="fill:#1b5e20"/>
<text x="34" y="38" style="fill:#fff;font-size:12px">NEWARE BTS</text>
<rect x="30" y="56" width="170" height="364" rx="4" class="body"/>
