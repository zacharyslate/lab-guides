<text x="44" y="98" class="lbl-s">▾ 127.0.0.1</text>
<text x="56" y="116" class="lbl" style="font-size:11px">CT-4008 (5V 12A)</text>
<text x="56" y="134" class="lbl" style="font-size:11px">CT-5008 (5V 12A)</text>
<g class="part" id="devSel"><rect x="50" y="140" width="146" height="20" style="fill:#c8e6c9"/></g>
<text x="56" y="154" class="lbl" style="font-size:11px;font-weight:700">CT-9008 (5V 6mA)</text>
<g id="tiles" class="lbl" style="font-size:11px">
<rect x="215" y="60" width="130" height="80" rx="4" class="body"/><text x="225" y="78">CH 1</text>
<rect x="355" y="60" width="130" height="80" rx="4" class="body"/><text x="365" y="78">CH 2</text>
<rect x="495" y="60" width="130" height="80" rx="4" class="body"/><text x="505" y="78">CH 3</text>
<rect x="635" y="60" width="135" height="80" rx="4" class="body"/><text x="645" y="78">CH 4</text>
</g>
<text x="225" y="100" class="lbl-s" id="ch1s">idle</text><text x="225" y="118" class="lbl-s" id="ch1v"></text>
<text x="365" y="100" class="lbl-s">working</text><text x="505" y="100" class="lbl-s">idle</text><text x="645" y="100" class="lbl-s">finished</text>
<g class="part" id="ch1run"><rect x="215" y="60" width="130" height="80" rx="4" style="fill:#4caf50;opacity:.28"/></g>
<g class="part" id="ctx"><rect x="290" y="110" width="140" height="110" rx="4" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<rect x="292" y="114" width="136" height="20" style="fill:#c8e6c9"/><text x="300" y="128" class="lbl" style="font-size:11px">Single start</text>
<text x="300" y="150" class="lbl" style="font-size:11px">Single stop</text><text x="300" y="170" class="lbl" style="font-size:11px">Continue</text><text x="300" y="190" class="lbl" style="font-size:11px">View data</text></g>
<g class="part" id="steps"><rect x="215" y="160" width="555" height="200" rx="5" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="228" y="180" class="lbl" style="font-weight:700">Step editor</text>
<g class="lbl" style="font-size:11px"><text x="228" y="202">#</text><text x="252" y="202">Step</text><text x="360" y="202">Current</text><text x="460" y="202">Cut-off V</text><text x="560" y="202">Time / other</text></g>
<line x1="228" y1="207" x2="760" y2="207" class="ln"/>
<g class="lbl" style="font-size:11px;font-family:monospace">
<text x="228" y="226">1</text><text x="252" y="226">Rest</text><text x="560" y="226">OCV, t</text>
<text x="228" y="246">2</text><text x="252" y="246">CC_Chg</text><text x="360" y="246">I (µA)</text><text x="460" y="246">V_max</text>
<text x="228" y="266">3</text><text x="252" y="266">Rest</text><text x="560" y="266">t</text>
<text x="228" y="286">4</text><text x="252" y="286">CC_DChg</text><text x="360" y="286">I (µA)</text><text x="460" y="286">V_min</text>
<text x="228" y="306">5</text><text x="252" y="306">Cycle</text><text x="560" y="306">from 2 · N times</text>
<text x="228" y="326">6</text><text x="252" y="326">End</text>
</g>
<text x="228" y="350" class="lbl-s">Protection: upper / lower voltage limits</text></g>
