<svg viewBox="0 0 800 525" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the MBraun EasyLab glovebox: main chamber, antechamber with inner and outer doors, argon refill valve, vacuum valve, pressure gauge, control panel (pressure, O₂ and H₂O displays, Min.set and Max.set knobs, circ, reg, reg abort, pump, ana, light, purge and eco buttons), catalyst circulation valves and foot pedals">
<text class="ttl" x="20" y="28" data-i18n="gb.title">MBraun EasyLab — bringing material in through the antechamber</text>
<rect class="body" x="40" y="70" width="420" height="250" rx="10"/>
<rect class="gl" x="60" y="85" width="380" height="150" rx="6"/>
<text class="lbl" x="72" y="104" data-i18n="gb.main">Main chamber (argon)</text>
<line class="ln" x1="60" y1="215" x2="440" y2="215"/>
<g class="part" id="gloves">
<circle class="st" cx="165" cy="275" r="36"/><circle class="dark" cx="165" cy="275" r="28"/>
<circle class="st" cx="335" cy="275" r="36"/><circle class="dark" cx="335" cy="275" r="28"/>
<text class="lbl-s" x="250" y="279" text-anchor="middle" data-i18n="gb.gloves">butyl gloves</text>
</g>
<rect class="st" x="460" y="145" width="12" height="110"/>
<rect class="body" x="472" y="155" width="246" height="90" rx="6"/>
