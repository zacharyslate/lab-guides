<path d="M267 374 A17 17 0 0 1 301 374" style="fill:none;stroke:#1d79c4;stroke-width:3.5"/><circle cx="284" cy="378" r="12" style="fill:#151719"/><line x1="284" y1="378" x2="290" y2="369" style="stroke:#f2efe6;stroke-width:2.6;stroke-linecap:round"/><text x="284" y="404" text-anchor="middle" class="gbp-lb">Max.set</text>
<rect x="130" y="356" width="90" height="28" rx="2" style="fill:#160909"/><text x="175.0" y="378" text-anchor="middle" id="pval" class="gbp-seg">2.7</text>
<text x="175" y="396" text-anchor="middle" class="gbp-lb">pressure mbar</text>
<text x="96" y="414" text-anchor="middle" class="gbp-lb">O₂ ppm</text><text x="254" y="414" text-anchor="middle" class="gbp-lb">H₂O ppm</text>
<rect x="56" y="418" width="80" height="26" rx="2" style="fill:#160909"/><text x="96.0" y="438" text-anchor="middle" id="o2val" class="gbp-seg">0.5</text><rect x="214" y="418" width="80" height="26" rx="2" style="fill:#160909"/><text x="254.0" y="438" text-anchor="middle" id="h2oval" class="gbp-seg">0.5</text>
<circle cx="54" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="88" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="122" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="156" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="190" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="224" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="258" cy="472" r="2.6" style="fill:#5a1414"/><circle cx="292" cy="472" r="2.6" style="fill:#5a1414"/>
<g class="part" id="ledCirc"><circle cx="54" cy="472" r="2.8" style="fill:#8a2b25"/></g><g class="part" id="ledPump"><circle cx="156" cy="472" r="3.4" style="fill:#ff3b30"/><circle cx="156" cy="472" r="7" style="fill:#ff3b30;opacity:.25"/></g><g class="part" id="ledAna"><circle cx="190" cy="472" r="3.4" style="fill:#ff3b30"/><circle cx="190" cy="472" r="7" style="fill:#ff3b30;opacity:.25"/></g><g class="part" id="ledLight"><circle cx="224" cy="472" r="3.4" style="fill:#ff3b30"/><circle cx="224" cy="472" r="7" style="fill:#ff3b30;opacity:.25"/></g><g class="part" id="ledEco"><circle cx="292" cy="472" r="3.4" style="fill:#3cff6a"/><circle cx="292" cy="472" r="7" style="fill:#3cff6a;opacity:.25"/></g>
<g class="part" id="btnCirc"><rect x="41" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="54" y="497" text-anchor="middle" class="gbp-bt">circ</text></g><g><rect x="75" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="88" y="497" text-anchor="middle" class="gbp-bt">reg</text></g><g><rect x="109" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="122" y="491" text-anchor="middle" class="gbp-bt">reg</text><text x="122" y="500" text-anchor="middle" class="gbp-bt">abort</text></g><g class="part" id="btnPump"><rect x="143" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="156" y="497" text-anchor="middle" class="gbp-bt">pump</text></g><g class="part" id="btnAna"><rect x="177" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="190" y="497" text-anchor="middle" class="gbp-bt">ana</text></g><g class="part" id="btnLight"><rect x="211" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="224" y="497" text-anchor="middle" class="gbp-bt">light</text></g><g><rect x="245" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="258" y="497" text-anchor="middle" class="gbp-bt">purge</text></g><g class="part" id="btnEco"><rect x="279" y="482" width="26" height="22" rx="3" class="gbp-btn"/><text x="292" y="497" text-anchor="middle" class="gbp-bt">eco</text></g>
<text class="lbl-s" x="336" y="512" data-i18n="gb.panel">Control panel</text>
