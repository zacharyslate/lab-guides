<text class="lbl-s" x="400" y="343" text-anchor="middle">UP</text>
</g>
<g class="part" id="pedals">
<rect class="dark" x="476" y="450" width="26" height="36" rx="4"/><rect class="dark" x="510" y="450" width="26" height="36" rx="4"/>
<text x="489" y="473" text-anchor="middle" style="fill:#fff;font-size:14px">−</text><text x="523" y="473" text-anchor="middle" style="fill:#fff;font-size:14px">+</text><text x="489" y="446" text-anchor="middle" style="font-size:6px;fill:var(--demo-muted)">LOW</text><text x="523" y="446" text-anchor="middle" style="font-size:6px;fill:var(--demo-muted)">HIGH</text>
<text class="lbl-s" x="506" y="503" text-anchor="middle" data-i18n="gb.pedals">foot pedals</text>
