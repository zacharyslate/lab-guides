<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the Mettler Toledo C20S coulometric Karl Fischer titrator: measuring cell with generator and indicator electrodes, drying tube, septum, syringe and balance">
<text class="ttl" x="20" y="28" data-i18n="kf.title">Mettler Toledo C20S — coulometric Karl Fischer titration</text>
<rect class="body" x="90" y="380" width="300" height="30" rx="5"/>
<text class="lbl-s" x="240" y="400" text-anchor="middle" data-i18n="kf.stirrer">titration stand with stirrer</text>
<path d="M140 190 V350 Q140 375 165 375 H315 Q340 375 340 350 V190" class="gl"/>
<rect x="132" y="178" width="216" height="16" rx="4" class="gl"/>
<g class="part" id="reag"><path d="M142 260 V350 Q142 373 165 373 H315 Q338 373 338 350 V260 Z" style="fill:#c9a227;opacity:.55"/></g>
<g class="part" id="stir"><rect x="220" y="362" width="40" height="7" rx="3" style="fill:#fff;stroke:#666"/></g>
<g class="part" id="gen"><rect x="172" y="120" width="34" height="200" rx="8" class="gl"/><rect x="176" y="300" width="26" height="14" style="fill:#888"/><text class="lbl-s" x="189" y="102" text-anchor="middle" data-i18n="kf.gen">generator</text></g>
<g class="part" id="ind"><rect x="232" y="130" width="14" height="200" rx="5" class="gl"/><rect x="235" y="320" width="8" height="12" style="fill:#c0c0c0"/><text class="lbl-s" x="239" y="122" text-anchor="middle" data-i18n="kf.ind">indicator</text></g>
<g class="part" id="dry"><rect x="276" y="100" width="22" height="80" rx="6" class="gl"/><g style="fill:#5c8fd6"><circle cx="283" cy="120" r="3"/><circle cx="291" cy="130" r="3"/><circle cx="283" cy="140" r="3"/><circle cx="291" cy="150" r="3"/><circle cx="285" cy="160" r="3"/></g><text class="lbl-s" x="287" y="92" text-anchor="middle" data-i18n="kf.dry">drying tube</text></g>
<g class="part" id="sept"><rect x="312" y="164" width="22" height="14" rx="3" style="fill:#d32f2f"/><text class="lbl-s" x="345" y="166" data-i18n="kf.sept">septum</text></g>
<g class="part" id="syr" data-from="60,0"><rect x="380" y="96" width="14" height="70" rx="3" class="gl"/><rect x="383" y="80" width="8" height="20" style="fill:#888"/><rect x="376" y="76" width="22" height="6" style="fill:#555"/><line x1="387" y1="166" x2="387" y2="190" style="stroke:#555;stroke-width:2"/><rect x="383" y="130" width="8" height="34" style="fill:#7fb3e0"/></g>
<g class="part" id="bal"><rect class="body" x="370" y="300" width="70" height="40" rx="4"/><rect class="st" x="378" y="294" width="54" height="6"/><text class="lbl-s" x="405" y="355" text-anchor="middle" data-i18n="kf.bal">balance</text></g>
<text class="lbl" x="405" y="324" text-anchor="middle" id="balkf" style="font-size:11px"></text>
<rect class="dark" x="470" y="80" width="310" height="300" rx="8"/>
<rect class="scr" x="490" y="100" width="270" height="170" rx="4"/>
<text class="scrtx" x="502" y="124" id="k1" style="font-size:12px">— off —</text>
<text class="scrtx" x="502" y="146" id="k2" style="font-size:12px"></text>
<text class="scrtx" x="502" y="168" id="k3" style="font-size:12px"></text>
<text class="scrtx" x="502" y="190" id="k4" style="font-size:12px"></text>
<text class="scrtx" x="502" y="250" id="k5" style="font-size:18px"></text>
<g class="part" id="kfBtn"><rect x="600" y="290" width="160" height="34" rx="4" style="fill:#2e7d32"/><text x="680" y="312" text-anchor="middle" style="fill:#fff;font-size:12px" id="kfBtnT">Start sample</text></g>
<text x="625" y="365" text-anchor="middle" style="fill:#fff;font-size:12px">C20S</text>
<g class="part" id="plugs"><path d="M189 120 C189 60 470 50 520 80" style="fill:none;stroke:#1e5bb8;stroke-width:3"/><path d="M239 130 C239 70 470 66 540 80" style="fill:none;stroke:#555;stroke-width:3"/><text class="lbl-s" x="330" y="56" style="fill:#1e5bb8" data-i18n="kf.blue">blue plug = generator</text></g>
