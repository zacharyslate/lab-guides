<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the Büchi Rotavapor R-210 with chiller, oil bath, evaporating flask with stopcock, condenser, receiving flask and vacuum controller">
