<g class="part" id="lift"><rect class="body" x="560" y="110" width="30" height="310"/><text class="lbl-s" x="575" y="300" text-anchor="middle" transform="rotate(-90 575 300)" data-i18n="rv.lift">lift (height)</text></g>
