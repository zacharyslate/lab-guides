<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the Anton Paar Cora 5001 Raman spectrometer with fibre probe in the docking station, sealed sample vial, Enable and Stop buttons and the touchscreen spectrum">
<text class="ttl" x="20" y="28" data-i18n="cora.title">Anton Paar Cora 5001 (fibre probe) — measuring a sealed sample</text>
<rect class="body" x="430" y="80" width="340" height="300" rx="10"/>
<rect class="scr" x="450" y="100" width="300" height="200" rx="5"/>
<text class="scrtx" x="462" y="122" id="cs1" style="font-size:12px">— warming up —</text>
<text class="scrtx" x="462" y="142" id="cs2" style="font-size:11px"></text>
<text class="scrtx" x="462" y="160" id="cs3" style="font-size:11px"></text>
<text class="scrtx" x="462" y="178" id="cs4" style="font-size:11px"></text>
<g class="part" id="focusplot"><path class="axis" d="M470 285 H600 M470 285 V200" style="stroke:#66ffb3"/><path d="M472 280 C500 278 515 210 535 208 C555 210 570 278 598 280" style="fill:none;stroke:#66ffb3;stroke-width:2"/><text x="604" y="288" style="fill:#9fb;font-size:9px">z</text></g>
<g class="part" id="spec"><path class="axis" d="M470 285 H740 M470 285 V190" style="stroke:#66ffb3"/><path d="M472 278 L520 276 L528 230 L535 276 L580 274 L588 200 L596 274 L640 272 L650 250 L658 272 L736 270" style="fill:none;stroke:#66ffb3;stroke-width:2"/><text x="700" y="298" style="fill:#9fb;font-size:9px">cm⁻¹</text></g>
<g class="part" id="measBtn"><rect x="640" y="315" width="110" height="28" rx="4" style="fill:#2e7d32"/><text x="695" y="334" text-anchor="middle" style="fill:#fff;font-size:12px">Measure</text></g>
<g class="part" id="pwr"><circle cx="460" cy="360" r="7" style="fill:#4cff8a"/></g>
<text class="lbl-s" x="472" y="364" data-i18n="cora.rear">rear power switch</text>
<path d="M430 330 C380 330 380 255 330 255" style="fill:none;stroke:#f0c419;stroke-width:5"/>
<rect class="body" x="40" y="250" width="300" height="80" rx="6"/>
<text class="lbl-s" x="190" y="345" text-anchor="middle" data-i18n="cora.dock">docking station</text>
<g class="part" id="dlid" data-origin="60 250"><rect x="60" y="238" width="120" height="14" rx="4" style="fill:var(--demo-steel);stroke:var(--demo-steel-dk)"/></g>
<g class="part" id="dvial" data-from="0,-80"><rect class="gl" x="102" y="176" width="34" height="96" rx="6"/><rect x="99" y="166" width="40" height="14" rx="3" class="dark"/><rect class="pw" x="105" y="236" width="28" height="33" rx="4"/></g>
<g class="part" id="fprobe"><rect x="200" y="246" width="110" height="18" rx="4" style="fill:#f0c419;stroke:#9a7b00"/><rect x="290" y="240" width="40" height="30" rx="4" class="dark"/>
<circle cx="303" cy="255" r="6" style="fill:#2e7d32"/><circle cx="320" cy="255" r="6" style="fill:#c62828"/><g class="part" id="ready"><circle cx="303" cy="255" r="3" style="fill:#b9ffcf"/></g></g>
<g class="part" id="screw"><circle cx="240" cy="285" r="7" class="st"/><line x1="235" y1="285" x2="245" y2="285" style="stroke:#333;stroke-width:2"/></g>
<g class="part" id="laser"><line x1="200" y1="255" x2="136" y2="255" style="stroke:#00e676;stroke-width:3"/><circle cx="134" cy="255" r="7" style="fill:#00e676;opacity:.45"/></g>
<text class="lbl-s" x="290" y="232" data-i18n="cora.btns">Enable · Stop</text>
<text class="lbl-s" x="150" y="160" id="vtxt"></text>
</svg>
