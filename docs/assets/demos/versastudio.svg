<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the VersaStudio software window: menu, toolbar with Run and Stop, experiment properties, graph, and the Select Instrument, Select an Action and Options dialogs">
<rect x="20" y="20" width="760" height="410" rx="6" style="fill:var(--md-default-bg-color,#fff);stroke:var(--demo-body-st)"/>
<rect x="20" y="20" width="760" height="26" rx="6" style="fill:#2c3e50"/>
<text x="34" y="38" style="fill:#fff;font-size:12px">VersaStudio</text>
<text x="34" y="62" class="lbl" style="font-size:12px">Experiment   Data   View   Tools   Security   Window   Help</text>
<line x1="20" y1="70" x2="780" y2="70" class="ln"/>
<g style="font-size:10px" class="lbl"><rect x="34" y="76" width="22" height="20" rx="3" class="body"/><text x="45" y="90" text-anchor="middle">N</text><rect x="62" y="76" width="22" height="20" rx="3" class="body"/><text x="73" y="90" text-anchor="middle">O</text><rect x="90" y="76" width="22" height="20" rx="3" class="body"/><text x="101" y="90" text-anchor="middle">S</text></g>
<g class="part" id="runB"><rect x="600" y="76" width="34" height="20" rx="3" style="fill:#2e7d32"/><text x="617" y="91" text-anchor="middle" style="fill:#fff;font-size:12px">▶</text></g>
<rect x="640" y="76" width="34" height="20" rx="3" style="fill:#c62828"/><text x="657" y="91" text-anchor="middle" style="fill:#fff;font-size:11px">■</text>
<rect x="680" y="76" width="34" height="20" rx="3" class="body"/><text x="697" y="91" text-anchor="middle" class="lbl" style="font-size:11px">⏭</text>
<text x="540" y="91" class="lbl-s" id="vchan">No Instrument</text>
<rect x="30" y="104" width="300" height="316" rx="4" class="body"/>
<text x="40" y="122" class="lbl" style="font-size:12px;font-weight:700" data-i18n="vs.props">Experiment Properties</text>
<g class="part" id="actions"><text x="44" y="144" class="lbl-s">Actions to be performed:</text><text x="54" y="162" class="lbl" style="font-size:12px">• Common</text><text x="54" y="180" class="lbl" style="font-size:12px;font-weight:700">• Potentiostatic EIS</text></g>
<g class="part" id="grid">
<g class="lbl" style="font-size:11px">
<text x="44" y="210">Start Frequency (Hz)</text><text x="230" y="210" id="g1">1E+6</text>
<text x="44" y="228">End Frequency (Hz)</text><text x="230" y="228" id="g2">0.1</text>
<text x="44" y="246">Amplitude (mV RMS)</text><text x="230" y="246" id="g3">10</text>
<text x="44" y="264">Point Spacing</text><text x="230" y="264">Logarithmic</text>
<text x="44" y="282">Points per decade</text><text x="230" y="282" id="g5">10</text>
<text x="44" y="300">DC Potential (V)</text><text x="230" y="300">0 vs OC</text>
</g>
<rect x="224" y="198" width="96" height="108" style="fill:#fff59d;opacity:.35"/>
</g>
<g class="part" id="adv"><g class="lbl" style="font-size:11px"><text x="44" y="330" style="font-weight:700">Advanced</text>
<text x="44" y="348">Cell to Use</text><text x="230" y="348" style="text-decoration:underline">External</text>
<text x="44" y="366">Current Range</text><text x="230" y="366" style="text-decoration:underline">Auto</text>
<text x="44" y="384">Electrometer</text><text x="230" y="384" style="text-decoration:underline">Single Ended</text>
<text x="44" y="402">Leave Cell On</text><text x="230" y="402" style="text-decoration:underline">No</text></g></g>
<rect x="345" y="104" width="425" height="316" rx="4" style="fill:none;stroke:var(--demo-body-st)"/>
<g class="part" id="nyqV"><path class="axis" d="M380 390 H750 M380 390 V130"/><text x="740" y="406" class="lbl-s">Z′ (Ω)</text><text x="352" y="140" class="lbl-s">−Z″</text>
<path d="M390 388 A80 80 0 0 1 550 388" class="trace"/><path d="M550 388 L700 180" class="trace"/></g>
<g class="part" id="dlgInst"><rect x="420" y="130" width="320" height="170" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="434" y="152" class="lbl" style="font-weight:700">Select Instrument</text>
<rect x="434" y="164" width="290" height="22" style="fill:none;stroke:var(--demo-body-st)"/><text x="442" y="180" class="lbl-s">No Instrument</text>
<rect x="434" y="186" width="290" height="22" style="fill:#c8e6c9;stroke:var(--demo-body-st)"/><text x="442" y="202" class="lbl" style="font-size:11px">PMC CH 2 · E 0.000 V · I 0 A</text>
<rect x="434" y="208" width="290" height="22" style="fill:none;stroke:var(--demo-body-st)"/><text x="442" y="224" class="lbl-s">PMC CH 3 · DATA</text>
<text x="434" y="260" class="lbl-s" data-i18n="vs.hint">double-click a channel · right-click › Locate Instrument</text></g>
<g class="part" id="dlgChk"><rect x="420" y="130" width="320" height="120" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="434" y="152" class="lbl" style="font-weight:700">Load Setup › Impedance Checkout</text>
<text x="434" y="176" class="lbl-s">Cell to Use = Internal (1 kΩ dummy)</text>
<text x="434" y="196" class="w-ok">expect |Z| = 1000 Ω ± 20 Ω</text></g>
<g class="part" id="dlgAct"><rect x="420" y="130" width="320" height="190" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="434" y="152" class="lbl" style="font-weight:700">Select an Action</text>
<g class="lbl" style="font-size:11px"><text x="440" y="176">Voltammetry ›</text><text x="440" y="194">Corrosion ›</text><text x="440" y="212">Energy ›</text><text x="440" y="230">Impedance ›</text></g>
<rect x="560" y="218" width="160" height="20" style="fill:#c8e6c9"/><text x="566" y="232" class="lbl" style="font-size:11px">Potentiostatic EIS</text>
<rect x="660" y="288" width="60" height="22" rx="3" style="fill:#2c3e50"/><text x="690" y="303" text-anchor="middle" style="fill:#fff;font-size:11px">OK</text></g>
<g class="part" id="dlgOpt"><rect x="420" y="130" width="320" height="150" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="434" y="152" class="lbl" style="font-weight:700">Tools › Options › Instrument</text>
<text x="434" y="180" class="lbl" style="font-size:11px">Notch Filter</text><text x="600" y="180" class="w-ok">None</text>
<text x="434" y="202" class="lbl" style="font-size:11px">EIS Filters</text><text x="600" y="202" class="lbl" style="font-size:11px">Normal</text>
<text x="434" y="224" class="lbl" style="font-size:11px">Float mode</text><text x="600" y="224" class="lbl" style="font-size:11px">Normal</text></g>
<g class="part" id="dlgExp"><rect x="420" y="130" width="320" height="130" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-ink)"/>
<text x="434" y="152" class="lbl" style="font-weight:700">Data › Export To</text>
<text x="440" y="178" class="lbl" style="font-size:11px">ZView (.z) — EIS actions</text>
<text x="440" y="198" class="lbl" style="font-size:11px">CSV</text>
<text x="440" y="226" class="lbl-s">or Graph View › Copy Data as Text</text></g>
<g class="part" id="saveHl"><rect x="88" y="74" width="26" height="24" rx="4" style="fill:none;stroke:var(--demo-hl);stroke-width:3"/></g>
</svg>
