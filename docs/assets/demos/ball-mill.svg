<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic of the Fritsch Pulverisette 7 classic line: sealed ZrO2 pot inside a steel tank, two bowl stations with spindle clamps, counterweight, hood and control panel">
<text class="ttl" x="20" y="28" data-i18n="bm.title">Fritsch Pulverisette 7 classic line — sealed milling</text>
<rect class="body" x="220" y="150" width="360" height="270" rx="8"/>
<rect x="238" y="166" width="324" height="236" rx="6" style="fill:var(--demo-bg);stroke:var(--demo-body-st)"/>
<g class="part" id="cork"><rect x="250" y="380" width="140" height="10" rx="2" style="fill:#b8865b"/><rect x="410" y="380" width="140" height="10" rx="2" style="fill:#b8865b"/></g>
<g class="part" id="cw" data-from="0,-60"><rect class="st" x="425" y="230" width="110" height="150" rx="8"/><text class="lbl-s" x="480" y="310" text-anchor="middle" data-i18n="bm.cw">counterweight</text><text class="lbl-s" x="480" y="324" text-anchor="middle" data-i18n="bm.cw2">same mass</text></g>
<g class="part" id="tankAsm">
<g class="part" id="tankBody"><rect class="st" x="40" y="180" width="110" height="150" rx="8"/></g>
<g class="part" id="zpot"><rect x="58" y="198" width="74" height="116" rx="6" style="fill:#f4f2ea;stroke:#a39f8f"/>
<g style="fill:#e9e6da;stroke:#8f8a78"><circle cx="72" cy="300" r="6"/><circle cx="86" cy="302" r="6"/><circle cx="100" cy="300" r="6"/><circle cx="114" cy="302" r="6"/><circle cx="79" cy="290" r="6"/><circle cx="93" cy="289" r="6"/><circle cx="107" cy="290" r="6"/><circle cx="121" cy="291" r="6"/><circle cx="86" cy="279" r="6"/><circle cx="100" cy="279" r="6"/><circle cx="114" cy="280" r="6"/></g>
<rect class="pw" x="64" y="268" width="62" height="6" rx="2"/></g>
<g class="part" id="potlid"><rect x="54" y="196" width="82" height="10" rx="3" style="fill:#f4f2ea;stroke:#a39f8f"/><rect x="58" y="206" width="74" height="3" style="fill:#fff;stroke:#bbb"/></g>
<g class="part" id="spacers"><rect x="62" y="186" width="66" height="8" rx="2" style="fill:#fafafa;stroke:#999"/><rect x="62" y="318" width="66" height="8" rx="2" style="fill:#fafafa;stroke:#999"/></g>
<g class="part" id="tankLid" data-from="0,-40"><rect class="st" x="36" y="168" width="118" height="14" rx="3"/><rect x="40" y="181" width="110" height="3" style="fill:#333"/></g>
</g>
<text class="lbl-s" x="95" y="350" text-anchor="middle" id="potlbl">ZrO₂ pot · 90 g balls Ø5 mm · 1 g</text>
<g class="part" id="clamp">
<rect class="st" x="255" y="196" width="130" height="10"/><rect class="st" x="255" y="196" width="8" height="184"/><rect class="st" x="377" y="196" width="8" height="184"/>
<rect class="st" x="415" y="196" width="130" height="10"/><rect class="st" x="415" y="196" width="8" height="184"/><rect class="st" x="537" y="196" width="8" height="184"/>
</g>
<g class="part" id="spindles"><rect class="dark" x="314" y="172" width="12" height="60"/><rect class="dark" x="304" y="186" width="32" height="8"/><rect class="dark" x="474" y="172" width="12" height="60"/><rect class="dark" x="464" y="186" width="32" height="8"/>
<text class="lbl-s" x="340" y="182">13</text><text class="lbl-s" x="340" y="194">14</text></g>
<g class="part" id="spin"><path d="M290 220 A40 18 0 0 1 350 220" style="fill:none;stroke:var(--demo-hl);stroke-width:3"/><path d="M350 220 l-10 -6 l1 10 z" style="fill:var(--demo-hl)"/><path d="M450 220 A40 18 0 0 1 510 220" style="fill:none;stroke:var(--demo-hl);stroke-width:3"/><path d="M510 220 l-10 -6 l1 10 z" style="fill:var(--demo-hl)"/><path d="M300 400 A110 18 0 0 0 500 400" style="fill:none;stroke:var(--demo-hl);stroke-width:2;stroke-dasharray:6 5"/></g>
<g class="part" id="hood" data-origin="580 137"><rect class="body" x="220" y="118" width="360" height="34" rx="14" style="fill:var(--demo-steel)"/><text class="lbl-s" x="400" y="140" text-anchor="middle" data-i18n="bm.hood">hood</text></g>
<rect class="dark" x="600" y="200" width="180" height="210" rx="6"/>
<text x="690" y="220" text-anchor="middle" style="fill:#fff;font-size:11px">pulverisette 7</text>
<rect class="scr" x="615" y="232" width="90" height="30" rx="3"/><text class="scrtx" x="660" y="253" text-anchor="middle" id="spd">100</text>
<text x="712" y="252" style="fill:#ccc;font-size:9px">rpm</text>
<rect class="scr" x="615" y="276" width="90" height="30" rx="3"/><text class="scrtx" x="660" y="297" text-anchor="middle" id="tim">00:00</text>
<text x="712" y="296" style="fill:#ccc;font-size:9px" id="timu">time</text>
<rect class="scr" x="615" y="320" width="50" height="30" rx="3"/><text class="scrtx" x="640" y="341" text-anchor="middle" id="rep">00</text>
<text x="672" y="340" style="fill:#ccc;font-size:9px">reps</text>
<g class="part" id="startB"><rect x="615" y="365" width="70" height="28" rx="3" style="fill:#2e7d32"/><text x="650" y="384" text-anchor="middle" style="fill:#fff;font-size:11px">START</text></g>
<g class="part" id="stopB"><rect x="695" y="365" width="70" height="28" rx="3" style="fill:#c62828"/><text x="730" y="384" text-anchor="middle" style="fill:#fff;font-size:11px">STOP</text></g>
<g class="part" id="mainsw"><circle cx="770" cy="430" r="7" style="fill:#4cff8a"/><text class="lbl-s" x="758" y="434" text-anchor="end" data-i18n="bm.main">main switch (rear)</text></g>
<g class="part" id="gb"><rect x="15" y="140" width="170" height="225" rx="8" style="fill:none;stroke:var(--demo-ar);stroke-width:2;stroke-dasharray:6 4"/><text class="lbl-s" x="20" y="134" style="fill:var(--demo-ar)" data-i18n="bm.gb">in the glovebox (argon)</text></g>
</svg>
